apply plugin: 'com.android.application'

android {
    namespace = "com.sigaa.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sigaa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        institutional {
            if (System.getenv('SIGAA_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('SIGAA_ANDROID_KEYSTORE'))
                storePassword System.getenv('SIGAA_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SIGAA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SIGAA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.institutional
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name in ['packageRelease', 'assembleRelease', 'bundleRelease'] }) {
        ['SIGAA_ANDROID_KEYSTORE', 'SIGAA_ANDROID_STORE_PASSWORD', 'SIGAA_ANDROID_KEY_ALIAS', 'SIGAA_ANDROID_KEY_PASSWORD'].each { key ->
            if (!System.getenv(key)) throw new GradleException("Falta configurar ${key} para firmar la release institucional")
        }
        if (!file(System.getenv('SIGAA_ANDROID_KEYSTORE')).isFile()) throw new GradleException('No existe el keystore institucional')
        def config = new groovy.json.JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
        if (config.android?.allowMixedContent || System.getenv('SIGAA_ANDROID_ALLOW_HTTP') == 'true') {
            throw new GradleException('La release no permite mixed content ni excepciones HTTP')
        }
        def api = System.getenv('SIGAA_ANDROID_API_URL')
        if (!api || !api.startsWith('https://')) throw new GradleException('Configure el dominio HTTPS institucional antes de generar release')
        def metadataFile = file('src/main/assets/public/sigaa-build.json')
        if (!metadataFile.isFile()) throw new GradleException('Sincronice el build release con npm run android:release')
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        if (!metadata.release || metadata.apiUrl != api.replaceAll('/$', '')) {
            throw new GradleException('Los recursos empaquetados no corresponden al dominio/build release solicitado')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

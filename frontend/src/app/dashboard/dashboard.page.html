<ion-header>
  <ion-toolbar>
    <ion-title>Dashboard</ion-title>
    <ion-button slot="end" fill="clear" (click)="logout()">
      Cerrar sesión
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="isLoading">Cargando datos...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="usuario">
    <h2>Bienvenido, {{ usuario?.nombre }}</h2>
    <ion-item>
      <ion-label><strong>Correo</strong></ion-label>
      <ion-label>{{ usuario?.correo }}</ion-label>
    </ion-item>
    <ion-item>
      <ion-label><strong>Roles</strong></ion-label>
      <ion-label>{{ usuario?.roles }}</ion-label>
    </ion-item>
    <ion-button expand="block" color="medium" (click)="logout()">
      Salir
    </ion-button>
  </div>
</ion-content>

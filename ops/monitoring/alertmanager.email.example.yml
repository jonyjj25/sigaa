global:
  smtp_smarthost: <smtp.institucion:587>
  smtp_from: <sigaa-alertas@institucion>
  smtp_auth_username: <usuario-smtp>
  smtp_auth_password: <secreto-smtp>
  smtp_require_tls: true

route:
  receiver: operacion-institucional
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: operacion-institucional
    email_configs:
      - to: <operaciones@institucion>
        send_resolved: true

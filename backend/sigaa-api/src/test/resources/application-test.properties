# TEST_DB_URL permite aislar las pruebas locales; en CI se reutiliza DB_URL del servicio PostgreSQL del job.
spring.datasource.url=${TEST_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/sigaa_test}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
# CORS de pruebas: orígenes ficticios y orígenes estándar del cliente móvil.
app.cors.allowed-origins=https://web.example.test,http://localhost:4200,http://localhost:8100,http://localhost,https://localhost,capacitor://localhost
app.cors.allowed-methods=GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
app.cors.exposed-headers=Content-Disposition
app.cors.allow-credentials=true
app.cors.max-age=600
jwt.expiration-ms=3600000
app.security.two-factor-token-expiry-ms=300000
app.security.ip-restriction-enabled=false
app.security.ip-whitelist-active=false
app.security.ip-whitelist=
app.security.ip-blacklist=
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.application.name=sigaa-api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/sigaa_dev
spring.datasource.username=sigaa_user
spring.datasource.password=sigaa_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
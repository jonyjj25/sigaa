spring.application.name=sigaa-api
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

server.port=8080

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:sigaa}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigaa-database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
# El esquema se instala una sola vez con db/schema.sql. La API nunca ejecuta DDL al arrancar.
spring.sql.init.mode=never
spring.jpa.open-in-view=false
# No imprimir consultas ni valores de los registros en la consola.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.connections.pooling=WARN
spring.mvc.log-request-details=false

# JWT settings
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.rate-limit.window-seconds=${AUTH_RATE_WINDOW_SECONDS:900}
app.auth.rate-limit.identity-attempts=${AUTH_RATE_IDENTITY_ATTEMPTS:5}
app.auth.rate-limit.ip-attempts=${AUTH_RATE_IP_ATTEMPTS:30}
app.auth.rate-limit.base-block-seconds=${AUTH_RATE_BASE_BLOCK_SECONDS:30}
app.time-zone=${APP_TIME_ZONE:America/Panama}
app.reports.scheduler-delay-ms=${REPORT_SCHEDULER_DELAY_MS:60000}

# SMTP settings. Supply these through environment variables; never commit credentials.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mail settings (descomentar y configurar para email real)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=tu-correo@gmail.com
# spring.mail.password=tu-contraseña-app
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart upload limits
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:50MB}

# Parámetros técnicos de seguridad: solo despliegue, nunca políticas de BD.
app.security.two-factor-token-expiry-ms=${TWO_FACTOR_TOKEN_EXPIRY_MS:300000}
app.security.ip-restriction-enabled=${SECURITY_IP_RESTRICTION_ENABLED:}
app.security.ip-whitelist-active=${SECURITY_IP_WHITELIST_ACTIVE:false}
app.security.ip-whitelist=${SECURITY_IP_WHITELIST:}
app.security.ip-blacklist=${SECURITY_IP_BLACKLIST:}

# Respaldos PostgreSQL. En producción configure BACKUP_PG_DUMP y BACKUP_DIR.
app.backup.pg-dump-command=${BACKUP_PG_DUMP:C:/Program Files/PostgreSQL/18/bin/pg_dump.exe}
app.backup.pg-restore-command=${BACKUP_PG_RESTORE:C:/Program Files/PostgreSQL/18/bin/pg_restore.exe}
app.backup.directory=${BACKUP_DIR:backups}
app.backup.external-directory=${BACKUP_EXTERNAL_DIR:}
app.backup.encryption-key-base64=${BACKUP_ENCRYPTION_KEY_BASE64:}
app.backup.automatic-enabled=${BACKUP_AUTOMATIC_ENABLED:false}
app.backup.schedule-cron=${BACKUP_SCHEDULE_CRON:0 0 2 * * *}
app.backup.retention-days=${BACKUP_RETENTION_DAYS:30}
app.backup.retention-copies=${BACKUP_RETENTION_COPIES:30}
app.backup.restore-test-enabled=${BACKUP_RESTORE_TEST_ENABLED:false}
app.backup.restore-test-cron=${BACKUP_RESTORE_TEST_CRON:0 0 4 * * SUN}

# Observabilidad. Health/liveness/readiness no revelan detalles públicamente;
# el puerto de gestión escucha solo en loopback salvo configuración explícita.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# Conversor preferido para archivos Office. Las notas tienen un generador PDF integrado de respaldo.
# En Linux/Docker use LIBREOFFICE_COMMAND=soffice.
app.preview.libreoffice-command=${LIBREOFFICE_COMMAND:C:/Program Files/LibreOffice/program/soffice.exe}

# QR public URL (cambiar según el entorno de despliegue)
# Ejemplo: http://192.168.1.100:4200 o https://midominio.com
app.qr-public-url=${QR_PUBLIC_URL:http://localhost:4200}

# CORS técnico por ambiente. Sin orígenes explícitos no se permite acceso cross-origin.
# El perfil dev añade solo los orígenes locales de Angular/Ionic/Capacitor.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.cors-allowed-origins:}}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Content-Disposition}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:600}

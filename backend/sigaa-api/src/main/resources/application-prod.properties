# Production must not write SQL statements or bound values (which can contain
# personal data) to logs.  Keep detailed diagnostics in a non-production profile.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
server.forward-headers-strategy=framework
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
# En producción no se acepta el respaldo de orígenes de desarrollo. Configure
# CORS_ALLOWED_ORIGINS o las políticas CORS desde Configuración > Seguridad.
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
# /actuator/info no debe incluir variables de entorno ni metadatos de secretos.
management.info.env.enabled=false

# La API usa exclusivamente el rol de ejecución; el esquema canónico se instala
# una sola vez durante la inicialización de PostgreSQL.
app.backup.datasource.url=${DB_URL}
app.backup.datasource.username=${BACKUP_DB_USERNAME}
app.backup.datasource.password=${BACKUP_DB_PASSWORD}
app.monitoring.smtp-probe-enabled=true
